<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生星河</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #060611;
      color: #e8e8ec;
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      text-align: center;
      padding: 16px 20px 4px;
      z-index: 5;
      pointer-events: none;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 10px;
      color: #e8e8ec;
      text-shadow: 0 0 20px rgba(255, 200, 120, 0.3);
    }
    .header p {
      font-size: 10px;
      color: #665544;
      margin-top: 6px;
      letter-spacing: 3px;
    }

    .toolbar {
      position: fixed;
      top: 72px; left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 20px;
      z-index: 5;
    }
    .tool-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: #aaaabb;
      font-size: 12px;
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.25s;
      backdrop-filter: blur(8px);
    }
    .tool-btn:hover {
      background: rgba(255,200,120,0.1);
      color: #e8e8ec;
      border-color: rgba(255,200,120,0.25);
    }
    .tool-btn.focus-active {
      background: rgba(255,200,120,0.15);
      color: #ffcc88;
      border-color: rgba(255,200,120,0.4);
    }

    /* 银河系 Canvas */
    .galaxy-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
    }
    #galaxyCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #galaxyCanvas:active { cursor: grabbing; }

    /* hover 标签 */
    .hover-label {
      position: fixed;
      pointer-events: none;
      background: rgba(10, 10, 20, 0.85);
      border: 1px solid rgba(255, 200, 120, 0.2);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      color: #e8e8ec;
      white-space: nowrap;
      z-index: 6;
      opacity: 0;
      transition: opacity 0.15s;
      backdrop-filter: blur(6px);
    }
    .hover-label.show { opacity: 1; }
    .hover-label .hover-date {
      font-size: 10px;
      color: #887766;
      margin-top: 2px;
      font-family: monospace;
    }

    .hint {
      position: fixed;
      bottom: 16px; left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      color: #444455;
      letter-spacing: 1px;
      z-index: 5;
      pointer-events: none;
    }

    /* 时间索引面板 */
    .index-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 5, 12, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      z-index: 10;
    }
    .index-overlay.active { opacity: 1; pointer-events: auto; }
    .index-panel {
      position: fixed;
      top: 0; left: 0;
      width: 320px;
      max-width: 85vw;
      height: 100vh;
      background: #12121f;
      border-right: 1px solid rgba(255,255,255,0.08);
      transform: translateX(-100%);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 20;
      overflow-y: auto;
      padding: 28px 24px;
    }
    .index-panel.active { transform: translateX(0); }
    .index-close {
      position: absolute;
      top: 18px; right: 18px;
      width: 34px; height: 34px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      background: transparent;
      color: #888899;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.25s;
    }
    .index-close:hover { border-color: rgba(255,255,255,0.3); color: #e8e8ec; }
    .index-title { font-size: 16px; font-weight: 400; letter-spacing: 4px; margin-bottom: 6px; }
    .index-sub { font-size: 11px; color: #555566; letter-spacing: 1px; margin-bottom: 22px; }
    .index-year {
      font-size: 13px; color: #9999aa; letter-spacing: 2px;
      padding: 14px 0 8px; border-top: 1px solid rgba(255,255,255,0.06); cursor: pointer;
      transition: color 0.2s;
    }
    .index-year:hover { color: #ccccee; }
    .index-year:first-of-type { border-top: none; }
    .index-year .year-count { font-size: 10px; color: #555566; margin-left: 6px; }
    .index-month {
      font-size: 11px; color: #666677; margin: 10px 0 4px 6px; letter-spacing: 1px; cursor: pointer;
    }
    .index-month:hover { color: #aaaabb; }
    .index-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 8px 7px 6px; margin-left: 6px;
      border-radius: 8px; cursor: pointer; transition: background 0.2s;
    }
    .index-item:hover { background: rgba(255,255,255,0.05); }
    .index-item-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }
    .index-item-text { font-size: 12px; color: #bbbccc; }
    .index-item-date { font-size: 10px; color: #555566; margin-left: auto; font-family: monospace; }

    /* 详情面板 */
    .detail-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 5, 12, 0.6); opacity: 0; pointer-events: none;
      transition: opacity 0.4s; z-index: 30;
    }
    .detail-overlay.active { opacity: 1; pointer-events: auto; }
    .detail-panel {
      position: fixed; top: 0; right: 0;
      width: 480px; max-width: 92vw; height: 100vh;
      background: #12121f;
      border-left: 1px solid rgba(255,255,255,0.08);
      transform: translateX(100%);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 40; overflow-y: auto; padding: 32px 34px;
    }
    .detail-panel.active { transform: translateX(0); }
    .detail-close {
      position: absolute; top: 20px; right: 24px;
      width: 36px; height: 36px;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
      background: transparent; color: #888899; font-size: 18px;
      cursor: pointer; transition: all 0.25s;
    }
    .detail-close:hover { border-color: rgba(255,255,255,0.3); color: #e8e8ec; }
    .detail-bead-preview {
      width: 64px; height: 64px; border-radius: 50%; margin-bottom: 18px;
      box-shadow: 0 0 24px rgba(255, 200, 120, 0.2);
    }
    .detail-title { font-size: 22px; font-weight: 400; margin-bottom: 6px; }
    .detail-meta { font-size: 12px; color: #666677; margin-bottom: 22px; letter-spacing: 1px; }
    .detail-tags { display: flex; gap: 8px; margin-bottom: 22px; }
    .detail-tag {
      font-size: 11px; padding: 4px 12px; border-radius: 12px;
      background: rgba(255,255,255,0.05); color: #aaaabb;
    }

    .edit-section {
      margin-bottom: 22px; padding: 16px; border-radius: 12px;
      background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.05);
    }
    .edit-label {
      font-size: 11px; color: #777788; letter-spacing: 1px;
      margin-bottom: 10px; text-transform: uppercase;
    }
    .edit-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .edit-row:last-child { margin-bottom: 0; }
    .edit-row label { font-size: 12px; color: #9999aa; min-width: 56px; }
    input[type="date"], input[type="text"] {
      flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px; color: #ddddee; font-size: 13px; padding: 6px 10px; font-family: inherit;
    }
    input[type="date"]:focus, input[type="text"]:focus { outline: none; border-color: rgba(255,255,255,0.25); }
    .material-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .material-option {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 10px 2px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.07);
      cursor: pointer; transition: all 0.2s;
    }
    .material-option:hover { background: rgba(255,255,255,0.05); }
    .material-option.selected { border-color: rgba(255,200,120,0.4); background: rgba(255,200,120,0.06); }
    .material-option-dot { width: 28px; height: 28px; border-radius: 50%; box-shadow: 0 0 10px rgba(255,255,255,0.1); }
    .material-option-name { font-size: 9px; color: #888899; }
    .tint-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .tint-row label { font-size: 11px; color: #888899; min-width: 50px; }
    input[type="color"] {
      width: 38px; height: 28px; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px; background: transparent; cursor: pointer; padding: 0;
    }
    .tint-hex { font-size: 11px; color: #666677; font-family: monospace; }

    .photo-upload-zone {
      width: 100%; height: 180px; border-radius: 12px;
      background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.25s; overflow: hidden; position: relative; margin-bottom: 20px;
    }
    .photo-upload-zone:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.2); }
    .photo-upload-zone .upload-hint { color: #555566; font-size: 12px; text-align: center; line-height: 1.8; }
    .photo-upload-zone .upload-hint span { font-size: 28px; display: block; margin-bottom: 6px; }
    .photo-upload-zone img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
    .photo-remove-btn {
      position: absolute; top: 8px; right: 8px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,0.6); border: none; color: #ff6677; font-size: 16px;
      cursor: pointer; display: none;
    }
    .photo-upload-zone.has-photo .photo-remove-btn { display: block; }
    .photo-upload-zone.has-photo .upload-hint { display: none; }

    .detail-text {
      font-size: 14px; line-height: 2; color: #ccccee; margin-bottom: 24px;
      background: transparent; border: none; width: 100%; resize: vertical;
      min-height: 60px; font-family: inherit; outline: none;
    }
    .detail-music {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      border-radius: 10px; background: rgba(255,255,255,0.03);
    }
    .music-play-btn { width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; flex-shrink: 0; }
    .music-info { flex: 1; }
    .music-title { font-size: 12px; color: #aaaabb; margin-bottom: 4px; }
    .music-bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.08); position: relative; }
    .music-progress { width: 0%; height: 100%; border-radius: 2px; transition: width 0.2s linear; }

    .music-search-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .music-search-input {
      flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; color: #ccccee; font-size: 12px; padding: 8px 12px; outline: none; font-family: inherit;
    }
    .music-search-input:focus { border-color: rgba(255,255,255,0.2); }
    .music-search-btn {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
      color: #aaaabb; font-size: 11px; padding: 8px 14px; border-radius: 8px; cursor: pointer;
      flex-shrink: 0; transition: all 0.2s;
    }
    .music-search-btn:hover { background: rgba(255,255,255,0.12); color: #e8e8ec; }
    .music-search-results { max-height: 0; overflow: hidden; transition: max-height 0.3s; margin-bottom: 4px; }
    .music-search-results.show { max-height: 200px; overflow-y: auto; }
    .music-result-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border-radius: 6px; cursor: pointer; transition: background 0.15s;
    }
    .music-result-item:hover { background: rgba(255,255,255,0.06); }
    .music-result-item .song-name { font-size: 12px; color: #ccccee; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .music-result-item .song-artist { font-size: 11px; color: #666677; flex-shrink: 0; }
    .music-url-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .music-url-input {
      flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; color: #ccccee; font-size: 11px; padding: 6px 10px; outline: none; font-family: monospace;
    }
    .music-section-label { font-size: 10px; color: #555566; margin-bottom: 4px; letter-spacing: 1px; }

    .delete-btn {
      width: 100%; padding: 10px; margin-top: 12px; border-radius: 8px;
      border: 1px solid rgba(255,80,100,0.15); background: rgba(255,80,100,0.05);
      color: #ff6677; font-size: 12px; cursor: pointer; transition: all 0.25s; font-family: inherit;
    }
    .delete-btn:hover { background: rgba(255,80,100,0.12); border-color: rgba(255,80,100,0.3); }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .detail-panel.active > * { animation: fadeInUp 0.5s ease forwards; }
    .detail-panel.active > *:nth-child(2) { animation-delay: 0.06s; }
    .detail-panel.active > *:nth-child(3) { animation-delay: 0.12s; }
    .detail-panel.active > *:nth-child(4) { animation-delay: 0.18s; }
    .detail-panel.active > *:nth-child(5) { animation-delay: 0.24s; }
    .detail-panel.active > *:nth-child(6) { animation-delay: 0.30s; }
    .detail-panel.active > *:nth-child(7) { animation-delay: 0.36s; }
    .detail-panel.active > *:nth-child(8) { animation-delay: 0.42s; }
    .detail-panel.active > *:nth-child(9) { animation-delay: 0.48s; }
  </style>
</head>
<body>

  <div class="header">
    <h1>GALAXY OF LIFE</h1>
    <p>Every star, a moment of light</p>
  </div>

  <div class="toolbar">
    <button class="tool-btn" id="focusBtn">✦ Focus Latest</button>
    <button class="tool-btn" id="indexBtn">⋰ Index</button>
    <button class="tool-btn" id="addBeadBtn">＋ New Star</button>
    <button class="tool-btn" id="exportBtn">⬇ Export</button>
    <button class="tool-btn" id="importBtn">⬆ Import</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>

  <div class="galaxy-container">
    <canvas id="galaxyCanvas"></canvas>
  </div>
  <div class="hover-label" id="hoverLabel"></div>

  <div class="hint">Drag to rotate · Scroll to zoom · Click a star to open memory</div>

  <div class="index-overlay" id="indexOverlay"></div>
  <div class="index-panel" id="indexPanel">
    <button class="index-close" id="indexCloseBtn">&times;</button>
    <div class="index-title">TIMELINE INDEX</div>
    <div class="index-sub">Browse by year · month · day</div>
    <div id="indexTree"></div>
  </div>

  <div class="detail-overlay" id="overlay"></div>
  <div class="detail-panel" id="detailPanel">
    <button class="detail-close" id="closeBtn">&times;</button>
    <div class="detail-bead-preview" id="detailBead"></div>
    <div class="detail-title" id="detailTitle"></div>
    <div class="detail-meta" id="detailMeta"></div>
    <div class="detail-tags" id="detailTags"></div>

    <div class="edit-section">
      <div class="edit-label">Edit This Star</div>
      <div class="edit-row">
        <label>Title</label>
        <input type="text" id="editTitle" placeholder="Name this star">
      </div>
      <div class="edit-row">
        <label>Date</label>
        <input type="date" id="editDate">
      </div>
      <div class="edit-label" style="margin-top:14px">Material (color palette)</div>
      <div class="material-grid" id="materialGrid"></div>
      <div class="edit-label" style="margin-top:14px">Custom Color</div>
      <div class="tint-row">
        <label>Highlight</label>
        <input type="color" id="tintHighlight">
        <span class="tint-hex" id="hexHighlight"></span>
      </div>
      <div class="tint-row">
        <label>Mid</label>
        <input type="color" id="tintMid">
        <span class="tint-hex" id="hexMid"></span>
      </div>
      <div class="tint-row">
        <label>Shadow</label>
        <input type="color" id="tintShadow">
        <span class="tint-hex" id="hexShadow"></span>
      </div>
      <div class="edit-label" style="margin-top:14px">Size</div>
      <div class="tint-row">
        <label>Size</label>
        <input type="range" id="beadSize" min="4" max="20" step="1" style="flex:1;accent-color:#F0997B">
        <span class="tint-hex" id="hexSize" style="min-width:36px;text-align:right">Default</span>
      </div>
    </div>

    <div class="music-section-label">Photo</div>
    <div class="photo-upload-zone" id="photoArea">
      <div class="upload-hint"><span>📷</span>Click to upload</div>
      <button class="photo-remove-btn" id="photoRemoveBtn">&times;</button>
    </div>
    <input type="file" id="photoFile" accept="image/*" style="display:none">

    <textarea class="detail-text" id="detailText" placeholder="Write the story of this moment..."></textarea>

    <div class="music-section-label">Music</div>
    <div class="music-url-row">
      <input type="text" class="music-url-input" id="musicUrlInput" placeholder="Write down a song name to remember it">
    </div>

    <button class="delete-btn" id="deleteBeadBtn">🗑 Delete this star</button>
  </div>

  <script>
    /* ==========================================================
       一、珠子材质库（颜色方案）
       在银河系视图中，珠子只保留颜色 + 发光，不画材质细节。
       材质库的作用是提供颜色方案 + 调色基础。
       ========================================================== */
    const MATERIALS = {
      pearl:     { name: '珍珠',    tint: { highlight: '#FFF4D6', mid: '#E8B86D', shadow: '#9A6A28' } },
      glass:     { name: '琉璃',    tint: { highlight: '#C8F5E4', mid: '#5DCAA5', shadow: '#0F6E56' } },
      rose:      { name: '蔷薇石',  tint: { highlight: '#FBD8E4', mid: '#ED93B1', shadow: '#993556' } },
      amethyst:  { name: '紫水晶',  tint: { highlight: '#DDD9F8', mid: '#AFA9EC', shadow: '#534AB7' } },
      sapphire:  { name: '蓝宝石',  tint: { highlight: '#C5DDF4', mid: '#85B7EB', shadow: '#185FA5' } },
      amber:     { name: '琥珀',    tint: { highlight: '#FAD4BE', mid: '#F0997B', shadow: '#993C1D' } },
      wood:      { name: '木质',    tint: { highlight: '#D9A86C', mid: '#A06A35', shadow: '#5C3A18' } },
      metal:     { name: '金属',    tint: { highlight: '#F0F0F5', mid: '#A8A8B8', shadow: '#4A4A5A' } },
      obsidian:  { name: '黑曜石',  tint: { highlight: '#7A7A8E', mid: '#3A3A48', shadow: '#1A1A24' } },
      moonstone: { name: '月光石',  tint: { highlight: '#EEF4FF', mid: '#C8D4F0', shadow: '#8A98C8' } },
      jade:      { name: '玉石',    tint: { highlight: '#D4F0D8', mid: '#7AC898', shadow: '#2E7050' } }
    };

    /* ==========================================================
       二、珠子数据 —— localStorage 持久化
       ========================================================== */
    const STORAGE_KEY = 'life_beads_data';

    const DEFAULT_BEADS = [
      { id: 0, title: '毕业那天', date: '2023-06-15', materialKey: 'pearl', tint: null, emotion: '自由 · 释然', text: '四年终于结束了。走出校门的那一刻，风很大，心里空空的，但那种空是好的空。', music: 'Good Riddance — Green Day' },
      { id: 1, title: '独自旅行', date: '2023-12-08', materialKey: 'glass', tint: null, emotion: '自由 · 清醒', text: '一个人坐在海边看了整晚的星星。原来孤独可以这么舒服，不需要跟任何人解释自己。', music: 'Weightless — Marconi Union' },
      { id: 2, title: '初次相遇', date: '2024-03-22', materialKey: 'rose', tint: null, emotion: '心动 · 温柔', text: '你笑起来的样子，让我觉得之前的所有等待都有了意义。', music: 'La Vie En Rose — Louis Armstrong' },
      { id: 3, title: '人生的转折', date: '2024-09-10', materialKey: 'amethyst', tint: null, emotion: '蜕变 · 不确定', text: '那天雨刚停，我站在路口，突然想通了一些事。有些路只能自己走，这不是孤独，是成长。', music: 'River Flows in You — Yiruma' },
      { id: 4, title: '一个顿悟', date: '2025-01-18', materialKey: 'sapphire', tint: null, emotion: '通透 · 平静', text: '原来所谓的"想开了"，不是突然有了答案，而是终于不再执着于找答案了。', music: 'Clair de Lune — Debussy' },
      { id: 5, title: '此刻', date: '2025-07-25', materialKey: 'amber', tint: null, emotion: '温暖 · 进行时', text: '你正在读这段文字。这就是此刻。这颗珠子还在发光，因为故事还在继续。', music: 'Here Comes the Sun — The Beatles' }
    ];

    function loadBeads() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const data = JSON.parse(saved);
          if (data.beads && Array.isArray(data.beads) && data.beads.length > 0) return data.beads;
        }
      } catch (e) { console.warn('读取存档失败，使用默认数据', e); }
      return DEFAULT_BEADS.map(b => ({ ...b, tint: b.tint ? { ...b.tint } : null }));
    }

    function saveBeads() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ beads: beads, nextId: nextId })); }
      catch (e) { console.warn('保存失败', e); }
    }

    let beads = loadBeads();
    let nextId = beads.length > 0 ? Math.max(...beads.map(b => b.id)) + 1 : 0;

    /* ==========================================================
       三、工具函数
       ========================================================== */
    function sortedBeads() { return [...beads].sort((a, b) => new Date(a.date) - new Date(b.date)); }

    function hexToRgbTriplet(hex) {
      const h = hex.replace('#', '');
      return parseInt(h.slice(0,2),16) + ',' + parseInt(h.slice(2,4),16) + ',' + parseInt(h.slice(4,6),16);
    }

    function hexToRgba(hex, alpha) {
      const h = hex.replace('#', '');
      return 'rgba(' + parseInt(h.slice(0,2),16) + ',' + parseInt(h.slice(2,4),16) + ',' + parseInt(h.slice(4,6),16) + ',' + alpha + ')';
    }

    function compactDate(iso) {
      const d = new Date(iso);
      return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
    }
    function fullDate(iso) {
      const d = new Date(iso);
      return d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日';
    }

    /* ==========================================================
       四、银河系 Canvas 渲染引擎
       —— 深空背景 + 暖金橙星云 + 螺旋臂尘埃 + 中心核 + 发光恒星（珠子）
       ========================================================== */
    const canvas = document.getElementById('galaxyCanvas');
    const ctx = canvas.getContext('2d');
    const hoverLabel = document.getElementById('hoverLabel');

    let cw = 0, ch = 0;
    let galaxyRotation = 0;           // 银河系旋转角度
    let autoRotateSpeed = 0.0004;     // 自动旋转速度
    let isAutoRotating = true;        // 是否自动旋转
    let viewScale = 1;                // 视图缩放
    let targetScale = 1;              // 目标缩放（用于平滑过渡）
    let viewOffsetX = 0, viewOffsetY = 0;
    let targetOffsetX = 0, targetOffsetY = 0;

    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let hoveredBeadId = null;
    let highlightedBeadId = null;
    let highlightTimer = null;
    let isFocused = false;            // 是否在聚焦模式

    // 视图过渡：0 = 银河系视图，1 = 曲线视图
    let viewTransition = 0;
    let targetViewTransition = 0;
    const TILT_Y = 0.55;              // 侧俯视 y 方向压扁系数（模拟 35 度倾斜）

    // 曲线视图的滚动：显示最近 N 颗珠子，可左右滚动查看更早的
    const TIMELINE_WINDOW = 7;        // 窗口大小（显示几颗珠子）
    let timelineScroll = 0;           // 从最新端往回滚了多少颗（0=看最新的）
    let targetTimelineScroll = 0;

    let backgroundStars = [];
    let nebulaParticles = [];
    let spiralDust = [];

    // 调整 Canvas 尺寸（支持高 DPI）
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      cw = window.innerWidth;
      ch = window.innerHeight;
      canvas.width = cw * dpr;
      canvas.height = ch * dpr;
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // 生成背景星（不跟随银河系旋转，增加深度感）
    function generateBackgroundStars() {
      backgroundStars = [];
      const count = 350;
      for (let i = 0; i < count; i++) {
        backgroundStars.push({
          x: (Math.random() - 0.5) * 2000,
          y: (Math.random() - 0.5) * 2000,
          r: Math.random() * 1.2 + 0.2,
          brightness: Math.random() * 0.5 + 0.2,
          twinkle: Math.random() * Math.PI * 2,
          twinkleSpeed: Math.random() * 0.02 + 0.005
        });
      }
    }

    // 生成星云（多色：暖金橙 + 玫红 + 粉紫 + 深蓝，营造壮阔梦幻感）
    function generateNebula() {
      nebulaParticles = [];
      const palettes = [
        { hueMin: 20, hueMax: 45 },   // 暖金橙
        { hueMin: 350, hueMax: 15 },  // 玫红
        { hueMin: 300, hueMax: 340 }, // 粉紫
        { hueMin: 200, hueMax: 240 }, // 深蓝
        { hueMin: 0, hueMax: 360 }    // 偶尔其他色
      ];
      const count = 80;
      for (let i = 0; i < count; i++) {
        const p = palettes[Math.floor(Math.random() * palettes.length)];
        let hue;
        if (p.hueMin > p.hueMax) {
          hue = (p.hueMin + Math.random() * (360 - p.hueMin + p.hueMax)) % 360;
        } else {
          hue = p.hueMin + Math.random() * (p.hueMax - p.hueMin);
        }
        nebulaParticles.push({
          angle: Math.random() * Math.PI * 2,
          dist: Math.random() * 320 + 40,
          r: Math.random() * 140 + 60,      // 更大更柔和
          hue: hue,
          sat: 60 + Math.random() * 30,
          lit: 50 + Math.random() * 20,
          alpha: Math.random() * 0.08 + 0.02 // 更低透明度，更梦幻
        });
      }
    }

    // 生成螺旋臂尘埃（更多粒子 + 更暗更模糊 + 多色，营造虚无缥缈感）
    function generateSpiralDust() {
      spiralDust = [];
      const numArms = 2;
      const particlesPerArm = 400;
      for (let arm = 0; arm < numArms; arm++) {
        const armOffset = (Math.PI * 2 / numArms) * arm;
        for (let i = 0; i < particlesPerArm; i++) {
          const t = i / particlesPerArm;
          const angle = armOffset + t * Math.PI * 3.2;
          const dist = 50 + t * 400;
          const spread = (Math.random() - 0.5) * 50;  // 更大散布
          // 随机色相：金橙为主，偶尔粉/蓝/紫
          const colorRoll = Math.random();
          let hue;
          if (colorRoll < 0.6) hue = 20 + Math.random() * 25;       // 60% 金橙
          else if (colorRoll < 0.8) hue = 300 + Math.random() * 40; // 20% 粉紫
          else hue = 200 + Math.random() * 40;                       // 20% 蓝
          spiralDust.push({
            angle: angle,
            dist: dist + spread,
            r: Math.random() * 1.8 + 0.2,   // 大小变化更大
            brightness: Math.random() * 0.35 + 0.05, // 更暗更柔和
            hue: hue
          });
        }
      }
    }

    // 计算珠子在银河系中的位置（沿螺旋臂按时间分布）
    // 侧俯视：y 方向压扁模拟 35 度倾斜
    function getBeadGalaxyPosition(bead) {
      const sorted = sortedBeads();
      const index = sorted.findIndex(b => b.id === bead.id);
      const total = sorted.length;
      const t = total === 1 ? 0.25 : index / (total - 1);

      // 盘面内旋转：角度 + 银河系自转角度
      const rotAngle = t * Math.PI * 2.8 + galaxyRotation;
      const dist = 70 + t * 340;

      // 先在盘面内计算位置，再 y 方向压扁投影到屏幕
      return {
        x: Math.cos(rotAngle) * dist,
        y: Math.sin(rotAngle) * dist * TILT_Y,
        angle: t * Math.PI * 2.8,
        dist: dist
      };
    }

    // 计算珠子在曲线视图中的位置（窗口式：只显示最近 N 颗，可滚动）
    // 返回 { x, y } 或 null（珠子不在当前窗口内）
    function getBeadTimelinePosition(bead) {
      const sorted = sortedBeads();
      const index = sorted.findIndex(b => b.id === bead.id);
      const total = sorted.length;

      // 窗口范围：最新端为 total-1，往回滚 timelineScroll 颗
      const windowEnd = total - 1 - timelineScroll;
      const windowStart = windowEnd - TIMELINE_WINDOW + 1;

      // 珠子在窗口内的相对位置（0=最左/最早，1=最右/最新）
      const t = (index - windowStart) / (TIMELINE_WINDOW - 1);

      // 窗口外的珠子不显示（留一点余量让珠子平滑滑入滑出）
      if (t < -0.15 || t > 1.15) return null;

      // S 形贝塞尔曲线控制点
      const w = Math.min(cw, 1200);
      const p0 = { x: -w * 0.42, y: ch * 0.08 };
      const p1 = { x: -w * 0.15, y: -ch * 0.18 };
      const p2 = { x: w * 0.15, y: ch * 0.22 };
      const p3 = { x: w * 0.42, y: -ch * 0.05 };

      // 三次贝塞尔曲线
      const mt = 1 - t;
      const x = mt*mt*mt*p0.x + 3*mt*mt*t*p1.x + 3*mt*t*t*p2.x + t*t*t*p3.x;
      const y = mt*mt*mt*p0.y + 3*mt*mt*t*p1.y + 3*mt*t*t*p2.y + t*t*t*p3.y;

      // 窗口边缘的珠子淡出
      let alpha = 1;
      if (t < 0) alpha = Math.max(0, 1 + t / 0.15);
      else if (t > 1) alpha = Math.max(0, 1 - (t - 1) / 0.15);

      return { x: x, y: y, alpha: alpha };
    }

    // 画曲线（更淡更模糊，虚无缥缈感）
    function drawTimelineCurve(alpha) {
      if (alpha <= 0.01) return;
      const w = Math.min(cw, 1200);
      const p0 = { x: -w * 0.42, y: ch * 0.08 };
      const p1 = { x: -w * 0.15, y: -ch * 0.18 };
      const p2 = { x: w * 0.15, y: ch * 0.22 };
      const p3 = { x: w * 0.42, y: -ch * 0.05 };

      ctx.save();
      ctx.globalAlpha = alpha;
      // 外层光晕线（很淡很宽）
      ctx.strokeStyle = 'rgba(255, 200, 120, 0.04)';
      ctx.lineWidth = 8;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
      ctx.stroke();
      // 内层虚线（更淡更稀疏）
      ctx.strokeStyle = 'rgba(255, 200, 120, 0.08)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 12]);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
      ctx.stroke();
      ctx.restore();
    }

    // 渲染一帧
    function renderGalaxy() {
      ctx.fillStyle = '#060611';
      ctx.fillRect(0, 0, cw, ch);

      const cx = cw / 2;
      const cy = ch / 2;
      const galaxyAlpha = 1 - viewTransition;  // 银河系透明度
      const timelineAlpha = viewTransition;      // 曲线透明度

      // —— 背景星（始终显示） ——
      backgroundStars.forEach(s => {
        s.twinkle += s.twinkleSpeed;
        const brightness = s.brightness * (0.6 + Math.sin(s.twinkle) * 0.4);
        ctx.fillStyle = 'rgba(200, 200, 220, ' + brightness + ')';
        ctx.beginPath();
        ctx.arc(cx + s.x * 0.5, cy + s.y * 0.5, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // —— 银河系（粒子在盘面内自转，椭圆轮廓不变） ——
      if (galaxyAlpha > 0.01) {
        ctx.save();
        ctx.globalAlpha = galaxyAlpha;
        ctx.translate(cx + viewOffsetX, cy + viewOffsetY);
        ctx.scale(viewScale, viewScale);

        // 星云（在盘面内旋转，y 方向压扁投影）
        nebulaParticles.forEach(n => {
          const a = n.angle + galaxyRotation;
          const nx = Math.cos(a) * n.dist;
          const ny = Math.sin(a) * n.dist * TILT_Y;
          const grad = ctx.createRadialGradient(nx, ny, 0, nx, ny, n.r);
          grad.addColorStop(0, 'hsla(' + n.hue + ',' + n.sat + '%,' + n.lit + '%,' + n.alpha + ')');
          grad.addColorStop(1, 'hsla(' + n.hue + ',' + n.sat + '%,' + n.lit + '%,0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(nx, ny, n.r, 0, Math.PI * 2);
          ctx.fill();
        });

        // 螺旋臂尘埃（在盘面内旋转，y 方向压扁）
        spiralDust.forEach(d => {
          const a = d.angle + galaxyRotation;
          const x = Math.cos(a) * d.dist;
          const y = Math.sin(a) * d.dist * TILT_Y;
          ctx.fillStyle = 'hsla(' + d.hue + ',75%,65%,' + d.brightness + ')';
          ctx.beginPath();
          ctx.arc(x, y, d.r, 0, Math.PI * 2);
          ctx.fill();
        });

        // 中心核（椭圆，不旋转 —— 它是盘面中心，旋转不变）
        ctx.save();
        ctx.scale(1, TILT_Y);
        const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 90);
        coreGrad.addColorStop(0, 'rgba(255, 245, 220, 0.9)');
        coreGrad.addColorStop(0.25, 'rgba(255, 210, 140, 0.6)');
        coreGrad.addColorStop(0.55, 'rgba(220, 160, 80, 0.25)');
        coreGrad.addColorStop(1, 'rgba(120, 80, 40, 0)');
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(0, 0, 90, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();
      }

      // —— 曲线视图（透明度随过渡变化） ——
      if (timelineAlpha > 0.01) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(viewScale, viewScale);
        drawTimelineCurve(timelineAlpha);
        ctx.restore();
      }

      // —— 珠子（位置在银河系和曲线之间插值） ——
      const sorted = sortedBeads();
      ctx.save();
      ctx.translate(cx + viewOffsetX * (1 - viewTransition), cy + viewOffsetY * (1 - viewTransition));
      ctx.scale(viewScale, viewScale);

      sorted.forEach((bead) => {
        const galaxyPos = getBeadGalaxyPosition(bead);
        const timelinePos = getBeadTimelinePosition(bead);

        // 曲线视图下，窗口外的珠子不渲染
        if (viewTransition > 0.5 && !timelinePos) {
          bead._currentPos = null;
          return;
        }

        // 位置插值（timelinePos 为 null 时退回银河系位置）
        const tlPos = timelinePos || { x: galaxyPos.x, y: galaxyPos.y, alpha: 1 };
        const pos = {
          x: galaxyPos.x + (tlPos.x - galaxyPos.x) * viewTransition,
          y: galaxyPos.y + (tlPos.y - galaxyPos.y) * viewTransition
        };
        // 窗口边缘淡出
        const beadAlpha = viewTransition > 0.5 ? tlPos.alpha : 1;

        const mat = MATERIALS[bead.materialKey];
        const tint = bead.tint || mat.tint;
        const color = tint.mid;
        const baseR = bead.size || (7 + (sorted.indexOf(bead) % 3) * 2);

        const isHovered = bead.id === hoveredBeadId;
        const isHighlighted = bead.id === highlightedBeadId;
        const beadR = isHovered || isHighlighted ? baseR * 1.5 : baseR;
        const glowR = isHovered || isHighlighted ? beadR * 6 : beadR * 3.5;

        ctx.save();
        ctx.globalAlpha = beadAlpha;

        // 外层光晕
        const glowGrad = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, glowR);
        glowGrad.addColorStop(0, hexToRgba(color, 0.7));
        glowGrad.addColorStop(0.3, hexToRgba(color, 0.25));
        glowGrad.addColorStop(1, hexToRgba(color, 0));
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, glowR, 0, Math.PI * 2);
        ctx.fill();

        // 珠子本体
        const beadGrad = ctx.createRadialGradient(
          pos.x - beadR * 0.3, pos.y - beadR * 0.3, 0,
          pos.x, pos.y, beadR
        );
        beadGrad.addColorStop(0, tint.highlight);
        beadGrad.addColorStop(0.5, tint.mid);
        beadGrad.addColorStop(1, tint.shadow);
        ctx.fillStyle = beadGrad;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, beadR, 0, Math.PI * 2);
        ctx.fill();

        // 高光小点
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(pos.x - beadR * 0.35, pos.y - beadR * 0.35, beadR * 0.15, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // 存储位置用于 hit detection
        bead._currentPos = pos;
        bead._currentR = beadR;
      });

      ctx.restore();
    }

    // 动画循环
    function animate() {
      if (!isDragging) {
        galaxyRotation += autoRotateSpeed;
      }
      // 平滑缩放
      if (Math.abs(viewScale - targetScale) > 0.001) {
        viewScale += (targetScale - viewScale) * 0.1;
      }
      // 平移平滑
      if (Math.abs(viewOffsetX - targetOffsetX) > 0.5) {
        viewOffsetX += (targetOffsetX - viewOffsetX) * 0.1;
      }
      if (Math.abs(viewOffsetY - targetOffsetY) > 0.5) {
        viewOffsetY += (targetOffsetY - viewOffsetY) * 0.1;
      }
      // 视图过渡平滑
      if (Math.abs(viewTransition - targetViewTransition) > 0.001) {
        viewTransition += (targetViewTransition - viewTransition) * 0.06;
      }
      // 曲线滚动平滑
      if (Math.abs(timelineScroll - targetTimelineScroll) > 0.01) {
        timelineScroll += (targetTimelineScroll - timelineScroll) * 0.12;
      }
      renderGalaxy();
      requestAnimationFrame(animate);
    }

    // 屏幕坐标 → 银河系坐标（反向变换）
    function screenToGalaxy(screenX, screenY) {
      const cx = cw / 2 + viewOffsetX * (1 - viewTransition);
      const cy = ch / 2 + viewOffsetY * (1 - viewTransition);
      const dx = (screenX - cx) / viewScale;
      const dy = (screenY - cy) / viewScale;
      // 反向旋转（只在银河系视图时有意义）
      const cos = Math.cos(-galaxyRotation);
      const sin = Math.sin(-galaxyRotation);
      return {
        x: dx * cos - dy * sin,
        y: dx * sin + dy * cos
      };
    }

    // Hit detection：检测鼠标位置下是哪颗珠子
    function getBeadAt(screenX, screenY) {
      const cx = cw / 2 + viewOffsetX * (1 - viewTransition);
      const cy = ch / 2 + viewOffsetY * (1 - viewTransition);
      const dx = (screenX - cx) / viewScale;
      const dy = (screenY - cy) / viewScale;
      const sorted = sortedBeads();
      for (let i = sorted.length - 1; i >= 0; i--) {
        const bead = sorted[i];
        if (!bead._currentPos) continue;
        const dist = Math.sqrt((dx - bead._currentPos.x) ** 2 + (dy - bead._currentPos.y) ** 2);
        if (dist < 15) return bead;
      }
      return null;
    }

    // 银河系坐标 → 屏幕坐标（用于定位 hover 标签）
    function galaxyToScreen(gx, gy) {
      const cx = cw / 2 + viewOffsetX * (1 - viewTransition);
      const cy = ch / 2 + viewOffsetY * (1 - viewTransition);
      return {
        x: cx + gx * viewScale,
        y: cy + gy * viewScale
      };
    }

    // —— 鼠标交互 ——
    canvas.addEventListener('mousemove', e => {
      const x = e.clientX;
      const y = e.clientY;

      if (isDragging) {
        targetOffsetX += x - dragStartX;
        targetOffsetY += y - dragStartY;
        viewOffsetX = targetOffsetX;
        viewOffsetY = targetOffsetY;
        dragStartX = x;
        dragStartY = y;
        hoverLabel.classList.remove('show');
        return;
      }

      const bead = getBeadAt(x, y);
      if (bead) {
        hoveredBeadId = bead.id;
        canvas.style.cursor = 'pointer';
        const pos = galaxyToScreen(bead._currentPos.x, bead._currentPos.y);
        hoverLabel.innerHTML = '<div>' + bead.title + '</div><div class="hover-date">' + compactDate(bead.date) + '</div>';
        hoverLabel.style.left = (pos.x + 15) + 'px';
        hoverLabel.style.top = (pos.y - 30) + 'px';
        hoverLabel.classList.add('show');
      } else {
        hoveredBeadId = null;
        canvas.style.cursor = 'grab';
        hoverLabel.classList.remove('show');
      }
    });

    canvas.addEventListener('mousedown', e => {
      const x = e.clientX;
      const y = e.clientY;
      const bead = getBeadAt(x, y);
      if (!bead) {
        isDragging = true;
        dragStartX = x;
        dragStartY = y;
        canvas.style.cursor = 'grabbing';
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        canvas.style.cursor = 'grab';
      }
    });

    canvas.addEventListener('click', e => {
      const bead = getBeadAt(e.clientX, e.clientY);
      if (bead) showDetail(bead.id);
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      // 曲线视图时：滚轮改为横向滚动浏览珠子
      if (viewTransition > 0.5) {
        const total = sortedBeads().length;
        const maxScroll = Math.max(0, total - TIMELINE_WINDOW);
        if (e.deltaY > 0) {
          // 向下滚 → 看更早的（scroll 增大）
          targetTimelineScroll = Math.min(maxScroll, targetTimelineScroll + 1);
        } else {
          // 向上滚 → 看更近的（scroll 减小）
          targetTimelineScroll = Math.max(0, targetTimelineScroll - 1);
        }
      } else {
        // 银河系视图时：滚轮缩放
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        targetScale = Math.max(0.4, Math.min(6, targetScale * delta));
      }
    }, { passive: false });

    // —— "聚焦最近"功能：银河系 → 抽出曲线 → 聚焦最近珠子 ——
    const focusBtn = document.getElementById('focusBtn');
    focusBtn.addEventListener('click', () => {
      if (isFocused) {
        exitFocus();
        return;
      }
      const sorted = sortedBeads();
      if (sorted.length === 0) return;
      const latest = sorted[sorted.length - 1];

      isFocused = true;
      focusBtn.classList.add('focus-active');
      focusBtn.textContent = '✦ Back to Galaxy';

      // 触发视图过渡：银河系 → 曲线
      targetViewTransition = 1;
      // 重置滚动到最新端
      targetTimelineScroll = 0;
      timelineScroll = 0;
      // 更新提示
      document.getElementById('hint').textContent = 'Scroll to browse · Click a star · ESC to return';

      // 1.5 秒后高亮最近珠子（等过渡完成）
      setTimeout(() => {
        highlightedBeadId = latest.id;
      }, 1500);
    });

    function exitFocus() {
      isFocused = false;
      focusBtn.classList.remove('focus-active');
      focusBtn.textContent = '✦ Focus Latest';
      highlightedBeadId = null;
      // 触发视图过渡：曲线 → 银河系
      targetViewTransition = 0;
      // 重置缩放和偏移
      targetScale = 1;
      targetOffsetX = 0;
      targetOffsetY = 0;
      document.getElementById('hint').textContent = 'Drag to rotate · Scroll to zoom · Click a star to open memory';
    }

    // 高亮某颗珠子（时间索引点击时调用）
    function highlightBead(id) {
      highlightedBeadId = id;
      if (highlightTimer) clearTimeout(highlightTimer);
      highlightTimer = setTimeout(() => { highlightedBeadId = null; }, 2500);
    }

    // renderBeads 兼容函数（银河系持续渲染，数据变化自动反映）
    function renderBeads() { /* 银河系用 requestAnimationFrame 持续渲染 */ }

    /* ==========================================================
       五、时间索引：按年 → 月 → 珠子
       ========================================================== */
    function renderIndex() {
      const tree = document.getElementById('indexTree');
      tree.innerHTML = '';
      const list = sortedBeads();
      const byYear = {};
      list.forEach(b => {
        const y = new Date(b.date).getFullYear();
        (byYear[y] = byYear[y] || []).push(b);
      });
      Object.keys(byYear).sort((a,b) => b-a).forEach(y => {
        const yearDiv = document.createElement('div');
        yearDiv.className = 'index-year';
        yearDiv.innerHTML = y + ' 年<span class="year-count">' + byYear[y].length + ' 颗</span>';
        tree.appendChild(yearDiv);
        const byMonth = {};
        byYear[y].forEach(b => {
          const m = new Date(b.date).getMonth() + 1;
          (byMonth[m] = byMonth[m] || []).push(b);
        });
        Object.keys(byMonth).sort((a,b) => a-b).forEach(m => {
          const monthDiv = document.createElement('div');
          monthDiv.className = 'index-month';
          monthDiv.textContent = m + ' 月';
          tree.appendChild(monthDiv);
          byMonth[m].sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(b => {
            const mat = MATERIALS[b.materialKey];
            const tint = b.tint || mat.tint;
            const item = document.createElement('div');
            item.className = 'index-item';
            item.innerHTML =
              '<span class="index-item-dot" style="background:radial-gradient(circle at 35% 30%,' + tint.highlight + ',' + tint.mid + ' 45%,' + tint.shadow + ');color:' + tint.mid + '"></span>' +
              '<span class="index-item-text">' + b.title + '</span>' +
              '<span class="index-item-date">' + compactDate(b.date) + '</span>';
            item.addEventListener('click', () => {
              closeIndex();
              highlightBead(b.id);
              showDetail(b.id);
            });
            tree.appendChild(item);
          });
        });
      });
    }

    /* ==========================================================
       六、详情面板 + 编辑
       ========================================================== */
    const overlay = document.getElementById('overlay');
    const panel = document.getElementById('detailPanel');
    let currentBeadId = null;

    function buildMaterialGrid() {
      const grid = document.getElementById('materialGrid');
      grid.innerHTML = '';
      Object.entries(MATERIALS).forEach(([key, mat]) => {
        const opt = document.createElement('div');
        opt.className = 'material-option';
        opt.dataset.key = key;
        const tint = mat.tint;
        opt.innerHTML =
          '<span class="material-option-dot" style="background:radial-gradient(circle at 35% 30%,' + tint.highlight + ',' + tint.mid + ' 45%,' + tint.shadow + ')"></span>' +
          '<span class="material-option-name">' + mat.name + '</span>';
        opt.addEventListener('click', () => {
          const bead = beads.find(b => b.id === currentBeadId);
          if (!bead) return;
          bead.materialKey = key;
          bead.tint = null;
          syncDetailEditState(bead);
          updateDetailPreview(bead);
          saveBeads();
        });
        grid.appendChild(opt);
      });
    }

    function syncDetailEditState(bead) {
      const mat = MATERIALS[bead.materialKey];
      const tint = bead.tint || mat.tint;
      document.querySelectorAll('.material-option').forEach(o => {
        o.classList.toggle('selected', o.dataset.key === bead.materialKey);
      });
      document.getElementById('tintHighlight').value = tint.highlight;
      document.getElementById('tintMid').value = tint.mid;
      document.getElementById('tintShadow').value = tint.shadow;
      document.getElementById('hexHighlight').textContent = tint.highlight;
      document.getElementById('hexMid').textContent = tint.mid;
      document.getElementById('hexShadow').textContent = tint.shadow;
      document.getElementById('editTitle').value = bead.title;
      document.getElementById('editDate').value = bead.date;
      // 大小滑块
      const sizeInput = document.getElementById('beadSize');
      const sizeLabel = document.getElementById('hexSize');
      if (bead.size) {
        sizeInput.value = bead.size;
        sizeLabel.textContent = bead.size + 'px';
      } else {
        sizeInput.value = 9;
        sizeLabel.textContent = 'Default';
      }
    }

    function updateDetailPreview(bead) {
      const mat = MATERIALS[bead.materialKey];
      const tint = bead.tint || mat.tint;
      document.getElementById('detailBead').style.background =
        'radial-gradient(circle at 35% 30%, ' + tint.highlight + ', ' + tint.mid + ' 45%, ' + tint.shadow + ')';
      document.getElementById('detailTitle').textContent = bead.title;
      document.getElementById('detailMeta').textContent = fullDate(bead.date) + ' · ' + mat.name + ' · ' + bead.emotion;
      const tagsDiv = document.getElementById('detailTags');
      tagsDiv.innerHTML = '';
      [mat.name, bead.emotion].forEach(tag => {
        const span = document.createElement('span');
        span.className = 'detail-tag';
        span.textContent = tag;
        tagsDiv.appendChild(span);
      });
      document.getElementById('detailText').value = bead.text;

      const photoArea = document.getElementById('photoArea');
      const oldImg = photoArea.querySelector('img');
      if (oldImg) oldImg.remove();
      if (bead.photo) {
        const img = document.createElement('img');
        img.src = bead.photo;
        photoArea.appendChild(img);
        photoArea.classList.add('has-photo');
      } else {
        photoArea.classList.remove('has-photo');
      }

      // 音乐输入框显示歌名
      document.getElementById('musicUrlInput').value = bead.music || '';
    }

    function showDetail(id) {
      const bead = beads.find(b => b.id === id);
      if (!bead) return;
      currentBeadId = id;
      syncDetailEditState(bead);
      updateDetailPreview(bead);
      overlay.classList.add('active');
      panel.classList.add('active');
    }
    function closeDetail() {
      overlay.classList.remove('active');
      panel.classList.remove('active');
    }
    document.getElementById('closeBtn').addEventListener('click', closeDetail);
    overlay.addEventListener('click', closeDetail);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeDetail();
        closeIndex();
        if (isFocused) exitFocus();
      }
    });

    document.getElementById('editTitle').addEventListener('input', e => {
      const bead = beads.find(b => b.id === currentBeadId);
      if (bead) { bead.title = e.target.value; updateDetailPreview(bead); renderIndex(); saveBeads(); }
    });
    document.getElementById('editDate').addEventListener('change', e => {
      const bead = beads.find(b => b.id === currentBeadId);
      if (bead) { bead.date = e.target.value; updateDetailPreview(bead); renderIndex(); saveBeads(); }
    });
    document.getElementById('detailText').addEventListener('input', e => {
      const bead = beads.find(b => b.id === currentBeadId);
      if (bead) { bead.text = e.target.value; saveBeads(); }
    });
    [['tintHighlight','highlight'],['tintMid','mid'],['tintShadow','shadow']].forEach(([inputId, key]) => {
      document.getElementById(inputId).addEventListener('input', e => {
        const bead = beads.find(b => b.id === currentBeadId);
        if (!bead) return;
        const mat = MATERIALS[bead.materialKey];
        if (!bead.tint) bead.tint = { ...mat.tint };
        bead.tint[key] = e.target.value;
        document.getElementById('hex' + key.charAt(0).toUpperCase() + key.slice(1)).textContent = e.target.value;
        updateDetailPreview(bead);
        renderIndex();
        saveBeads();
      });
    });

    // 大小滑块
    document.getElementById('beadSize').addEventListener('input', e => {
      const bead = beads.find(b => b.id === currentBeadId);
      if (!bead) return;
      const val = parseInt(e.target.value);
      // 9 是默认大小（7+2），选 9 时清除自定义大小
      if (val === 9) {
        bead.size = null;
        document.getElementById('hexSize').textContent = 'Default';
      } else {
        bead.size = val;
        document.getElementById('hexSize').textContent = val + 'px';
      }
      saveBeads();
    });

    /* ==========================================================
       七、时间索引面板开关
       ========================================================== */
    const indexOverlay = document.getElementById('indexOverlay');
    const indexPanel = document.getElementById('indexPanel');
    function openIndex() { indexOverlay.classList.add('active'); indexPanel.classList.add('active'); }
    function closeIndex() { indexOverlay.classList.remove('active'); indexPanel.classList.remove('active'); }
    document.getElementById('indexBtn').addEventListener('click', openIndex);
    document.getElementById('indexCloseBtn').addEventListener('click', closeIndex);
    indexOverlay.addEventListener('click', closeIndex);

    /* ==========================================================
       八、新增珠子
       ========================================================== */
    document.getElementById('addBeadBtn').addEventListener('click', () => {
      const today = new Date().toISOString().slice(0,10);
      const bead = {
        id: nextId++, title: '新的珠子', date: today,
        materialKey: 'pearl', tint: null,
        emotion: 'Undefined', text: 'Write the story of this moment...', music: ''
      };
      beads.push(bead);
      renderIndex();
      showDetail(bead.id);
      saveBeads();
    });

    /* ==========================================================
       九、导出 / 导入备份
       ========================================================== */
    document.getElementById('exportBtn').addEventListener('click', () => {
      const data = JSON.stringify({ beads: beads, nextId: nextId, exportDate: new Date().toISOString() }, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'life-beads-backup-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });
    document.getElementById('importFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.beads && Array.isArray(data.beads)) {
            beads = data.beads;
            nextId = data.nextId || (beads.length > 0 ? Math.max(...beads.map(b => b.id)) + 1 : 0);
            saveBeads();
            renderIndex();
            closeDetail();
            alert('Imported successfully! ' + beads.length + ' stars restored.');
          } else {
            alert('Invalid file format. Please select a valid backup file.');
          }
        } catch (err) {
          alert('Read failed: ' + err.message);
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    /* ==========================================================
       十、照片上传
       ========================================================== */
    const photoArea = document.getElementById('photoArea');
    const photoFile = document.getElementById('photoFile');
    const photoRemoveBtn = document.getElementById('photoRemoveBtn');

    photoArea.addEventListener('click', e => {
      if (e.target === photoRemoveBtn) return;
      photoFile.click();
    });
    photoRemoveBtn.addEventListener('click', e => {
      e.stopPropagation();
      const bead = beads.find(b => b.id === currentBeadId);
      if (bead) { bead.photo = null; saveBeads(); updateDetailPreview(bead); }
    });

    photoFile.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) { alert('Image too large (over 10MB). Please choose a smaller one.'); return; }
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const canvasEl = document.createElement('canvas');
          const maxW = 800, maxH = 600;
          let w = img.width, h = img.height;
          if (w > maxW) { h = h * (maxW / w); w = maxW; }
          if (h > maxH) { w = w * (maxH / h); h = maxH; }
          canvasEl.width = w; canvasEl.height = h;
          canvasEl.getContext('2d').drawImage(img, 0, 0, w, h);
          const compressed = canvasEl.toDataURL('image/jpeg', 0.7);
          const bead = beads.find(b => b.id === currentBeadId);
          if (bead) { bead.photo = compressed; saveBeads(); updateDetailPreview(bead); }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    /* ==========================================================
       十一、音乐（简化版：只记录歌名）
       ========================================================== */
    const musicUrlInput = document.getElementById('musicUrlInput');

    let musicInputTimer = null;
    musicUrlInput.addEventListener('input', () => {
      const bead = beads.find(b => b.id === currentBeadId);
      if (!bead) return;
      clearTimeout(musicInputTimer);
      musicInputTimer = setTimeout(() => {
        bead.music = musicUrlInput.value.trim() || '';
        saveBeads();
      }, 300);
    });

    /* ==========================================================
       十二、删除珠子
       ========================================================== */
    document.getElementById('deleteBeadBtn').addEventListener('click', () => {
      const bead = beads.find(b => b.id === currentBeadId);
      if (!bead) return;
      if (!confirm('Delete "' + bead.title + '"?\nThis cannot be undone. Consider exporting a backup first.')) return;
      const idx = beads.indexOf(bead);
      beads.splice(idx, 1);
      saveBeads();
      closeDetail();
      renderIndex();
    });

    /* ==========================================================
       十三、初始化
       ========================================================== */
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    generateBackgroundStars();
    generateNebula();
    generateSpiralDust();
    buildMaterialGrid();
    renderIndex();
    animate();
  </script>
</body>
</html>
